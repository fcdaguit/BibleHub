name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:   # Actions tab > Build APK > Run workflow

permissions:
  contents: write      # needed to attach the APK to a GitHub Release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Uses a Gradle install so no wrapper jar is needed.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      # Tests must not stop you from getting an APK on the first runs.
      - name: Unit tests
        continue-on-error: true
        run: gradle :app:testDebugUnitTest
      # Debug builds are signed automatically with the debug key and install directly.
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SermonStudio-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SermonStudio-debug-apk
          path: SermonStudio-debug.apk
      - name: Attach APK to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SermonStudio-debug.apk
